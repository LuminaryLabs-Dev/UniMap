<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: var(--figma-color-bg); color: var(--figma-color-text); font-size: 12px; }
    h1 { margin: 0 0 6px; font-size: 17px; }
    p { margin: 0 0 14px; color: var(--figma-color-text-secondary); line-height: 1.45; }
    .drop { border: 1px dashed var(--figma-color-border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .file { font-weight: 600; word-break: break-word; }
    .hint { margin-top: 4px; color: var(--figma-color-text-secondary); }
    .row { display: flex; gap: 8px; }
    button { border: 0; border-radius: 6px; padding: 9px 12px; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary { flex: 1; color: var(--figma-color-text-onbrand); background: var(--figma-color-bg-brand); }
    button.secondary { color: var(--figma-color-text); background: var(--figma-color-bg-secondary); }
    button:disabled { opacity: .45; cursor: default; }
    input { display: none; }
    #status { min-height: 34px; margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: var(--figma-color-bg-secondary); line-height: 1.4; }
    #status.error { color: var(--figma-color-text-danger); }
  </style>
</head>
<body>
  <h1>UniMap — Unity Brain Map</h1>
  <p>Load a UniMap JSON v1 export from Unity. Everything stays local; the plugin has no network access.</p>

  <div class="drop">
    <div class="file" id="fileName">No UniMap file selected</div>
    <div class="hint">Expected: <code>*.unimap.json</code> or JSON matching UniMap schema v1.</div>
  </div>

  <input id="fileInput" type="file" accept=".json,application/json" />
  <div class="row">
    <button class="secondary" id="choose">Choose JSON</button>
    <button class="primary" id="render" disabled>Render Brain Map</button>
    <button class="secondary" id="close">Close</button>
  </div>
  <div id="status">Ready.</div>

  <script>
    const MAX_FILE_BYTES = 10 * 1024 * 1024;
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const renderButton = document.getElementById('render');
    const status = document.getElementById('status');
    let rawJson = null;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.className = isError ? 'error' : '';
    }

    document.getElementById('choose').onclick = () => fileInput.click();
    document.getElementById('close').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    };

    fileInput.onchange = () => {
      const file = fileInput.files && fileInput.files[0];
      rawJson = null;
      renderButton.disabled = true;
      if (!file) return;
      fileName.textContent = file.name;

      if (file.size > MAX_FILE_BYTES) {
        setStatus('File is larger than the 10 MB safety limit.', true);
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        if (typeof reader.result !== 'string') {
          setStatus('Could not read the selected file as text.', true);
          return;
        }
        try {
          JSON.parse(reader.result);
          rawJson = reader.result;
          renderButton.disabled = false;
          setStatus('JSON loaded. Ready to render.');
        } catch {
          setStatus('The selected file is not valid JSON.', true);
        }
      };
      reader.onerror = () => setStatus('Could not read the selected file.', true);
      reader.readAsText(file, 'UTF-8');
    };

    renderButton.onclick = () => {
      if (!rawJson) return;
      renderButton.disabled = true;
      setStatus('Rendering Brain Map…');
      parent.postMessage({
        pluginMessage: {
          type: 'render-document',
          rawJson,
          fileName: fileName.textContent
        }
      }, '*');
    };

    onmessage = (event) => {
      const message = event.data && event.data.pluginMessage;
      if (!message || typeof message.type !== 'string') return;
      if (message.type === 'render-success') {
        setStatus(message.message || 'Brain Map rendered.');
      } else if (message.type === 'render-error') {
        setStatus(message.message || 'UniMap could not render this file.', true);
      }
      renderButton.disabled = !rawJson;
    };
  </script>
</body>
</html>
