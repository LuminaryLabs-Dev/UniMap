name: Validate UniMap

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-and-figjam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/figjam/package-lock.json

      - name: Install FigJam dependencies
        working-directory: clients/figjam
        run: npm ci

      - name: Build FigJam client
        working-directory: clients/figjam
        run: npm run build

      - name: Verify generated artifact is committed
        run: git diff --exit-code -- clients/figjam/dist/code.js

      - name: Run FigJam tests
        working-directory: clients/figjam
        run: npm test

      - name: Validate repository contract
        run: node scripts/validate-repo.mjs
